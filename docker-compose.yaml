services:
  confera_pg:
    image: postgres:16
    container_name: confera-pg
    ports:
      - "5434:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=confera
    volumes:
      - confera-postgres-data:/var/lib/postgresql/data
    networks:
      - confera-network

  minio:
    image: quay.io/minio/minio
    container_name: confera-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - confera-network 
    volumes:
      - confera-minio-data:/data
    environment:
      - MINIO_ROOT_USER=confera
      - MINIO_ROOT_PASSWORD=confera_password
    command: server /data --console-address ":9001"
    
networks:
  confera-network:
    driver: bridge

volumes:
  confera-postgres-data:
  confera-minio-data:
  confera-weaviate-data:
  confera-redis-data:
services:
  confera_pg:
    image: postgres:16
    container_name: confera-pg
    ports:
      - "5434:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=confera
    volumes:
      - confera-postgres-data:/var/lib/postgresql/data
    networks:
      - confera-network


  redis:
    image: redis:7-alpine
    container_name: confera-redis
    ports:
      - "6379:6379"
    networks:
      - confera-network


networks:
  confera-network:
    driver: bridge

volumes:
  confera-postgres-data:
[project]
name = "confera"
version = "0.1.0"
description = ""
authors = [{ name = "Ali Turki", email = "aliturkix@gmail.com" }]
requires-python = ">=3.13,<4.0"
readme = "README.md"
dependencies = [
    "redis[hiredis]>=6.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ruff>=0.11.8,<0.12",
    "jedi>=0.19.2,<0.20",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "packages/platform",
    "packages/shared",
    "packages/worker",
    "packages/voip-worker"
]

[project]
name = "confera-backend"
version = "0.1.0"
description = ""
authors = [
    {name = "Ali Turki",email = "aliturkix@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard] (>=0.115.12,<0.116.0)",
    "pydantic-settings (>=2.9.1,<3.0.0)",
    "pydantic (>=2.11.4,<3.0.0)",
    "loguru (>=0.7.3,<0.8.0) ; python_version < '4.0'",
    "sqlalchemy (>=2.0.40,<3.0.0)",
    "psycopg2-binary (>=2.9.10,<3.0.0)",
    "passlib[bcrypt] (>=1.7.4,<2.0.0)",
    "pyjwt (>=2.10.1,<3.0.0)",
    "slowapi ; python_version < '4.0'"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"


[tool.poetry]
package-mode = false



[tool.poetry.group.dev.dependencies]
ruff = "^0.11.8"
jedi = "^0.19.2"
alembic = "^1.15.2"

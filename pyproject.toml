[project]
name = "confera-backend"
version = "0.1.0"
description = ""
authors = [
    {name = "Ali Turki",email = "aliturkix@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.13,<4.0"
dependencies = [
    "fastapi[standard] (>=0.115.9,<0.116.0)",
    "pydantic-settings (>=2.9.1,<3.0.0)",
    "pydantic (>=2.11.4,<3.0.0)",
    "loguru (>=0.7.3,<0.8.0)",
    "sqlalchemy (>=2.0.40,<3.0.0)",
    "psycopg2-binary (>=2.9.10,<3.0.0)",
    "passlib[bcrypt] (>=1.7.4,<2.0.0)",
    "pyjwt (>=2.10.1,<3.0.0)",
    "slowapi",
    "livekit-agents[openai] (>=1.0,<2.0)",
    "minio (>=7.2.15,<8.0.0)",
    "redis[hiredis] (>=6.1.0,<7.0.0)",
    "pypdf2 (>=3.0.1,<4.0.0)",
    "python-docx (>=1.1.2,<2.0.0)",
    "openpyxl (>=3.1.5,<4.0.0)",
    "python-pptx (>=1.0.2,<2.0.0)",
    "chromadb (>=1.0.9,<2.0.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"


[tool.poetry]
package-mode = false



[tool.poetry.group.dev.dependencies]
ruff = "^0.11.8"
jedi = "^0.19.2"
alembic = "^1.15.2"
